[[headers]]
  for = "/*"
  [headers.values]
    # 1. Tetap untuk standar A+
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # 2. Mencegah browser menebak tipe file
    X-Content-Type-Options = "nosniff"
    
    # 3. Proteksi Clickjacking
    X-Frame-Options = "DENY"
    
    # 4. Referrer Policy
    Referrer-Policy = "no-referrer"
    
    # 5. Permissions Policy - Izinkan 'payment' untuk fungsi transaksi jika perlu
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()"
    
    # 6. Content Security Policy (CSP)
    # Penyesuaian: Memastikan script-src mengizinkan eksekusi logika internal keranjang
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"

    # 7. Cross-Origin Policies - PENYESUAIAN PENTING
    # Kita ubah Embedder-Policy agar tidak memblokir skrip internal yang memanipulasi DOM keranjang
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
