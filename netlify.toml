[[headers]]
  for = "/*"
  [headers.values]
    # 1. HSTS (Wajib untuk A+) - Berlaku selama 1 tahun
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # 2. Anti-Sniffing
    X-Content-Type-Options = "nosniff"
    
    # 3. Anti-Clickjacking (Melarang website dimasukkan ke iframe)
    X-Frame-Options = "DENY"
    
    # 4. Referrer Policy (Sangat aman)
    Referrer-Policy = "no-referrer"
    
    # 5. Permissions Policy (Matikan fitur hardware yang tidak perlu)
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()"
    
    # 6. CSP Terketat (Hanya izinkan aset internal 'self')
    # Sangat aman karena tidak ada script luar (seperti Google Maps) yang dimuat
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"

    # 7. Cross-Origin Policies (Terbaru & Sangat Ketat)
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
